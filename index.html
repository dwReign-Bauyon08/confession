<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Crush 💖</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="card">

      <h1>💌 Little Confession 💌</h1>

      <p class="question">
        Will you be my happy crush? 💖
      </p>

      <div class="buttons">

        <button id="yesBtn">
          Yes 💚
        </button>

        <button id="noBtn">
          No 💔
        </button>

      </div>

      <p id="message"></p>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
